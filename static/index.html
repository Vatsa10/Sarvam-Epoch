<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NyayBandhan</title>
<style>
  :root{--bg:#0b0d10;--card:#14181d;--line:#242a31;--ink:#e8edf2;--dim:#8a95a3;
        --ok:#2dd4a7;--warn:#f5a524;--bad:#f45b5b;--acc:#4d8dff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif;padding:20px}
  .wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:22px;letter-spacing:-.02em}
  .tag{color:var(--dim);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:12px}
  .mics{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}
  button{font:inherit;border:0;border-radius:10px;padding:14px 20px;cursor:pointer;color:#fff;transition:.12s}
  button:disabled{opacity:.45;cursor:not-allowed}
  .mic{flex:1;min-width:220px;background:#1e2938;border:1px solid var(--line);text-align:left}
  .mic:hover:not(:disabled){border-color:var(--acc)}
  .mic.rec{background:var(--bad);border-color:var(--bad);animation:p 1s infinite}
  @keyframes p{50%{opacity:.65}}
  .mic b{display:block;font-size:16px} .mic span{font-size:12px;color:var(--dim)}
  .mic.rec span{color:#fff}
  .ghost{background:#222a33;padding:10px 16px;font-size:13px}
  .term{border-bottom:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:1fr auto;gap:6px}
  .term:last-child{border-bottom:0}
  .term .k{font-weight:600;text-transform:capitalize}
  .term .v{color:var(--dim);font-size:13px}
  .st{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:20px;height:fit-content}
  .OPEN{background:#222a33;color:var(--dim)} .PROPOSED{background:#1e3050;color:#8fb8ff}
  .AGREED{background:#0e3a2e;color:var(--ok)} .DIVERGED{background:#4a1414;color:var(--bad)}
  .HEDGED{background:#43300c;color:var(--warn)} .REJECTED{background:#2a2a2a;color:#888}
  .note{grid-column:1/-1;background:#2a1414;border-left:3px solid var(--bad);padding:8px 10px;
        border-radius:0 6px 6px 0;font-size:12.5px;color:#ffc9c9}
  .quotes{grid-column:1/-1;font-size:12.5px;color:var(--dim)}
  .quotes div{padding:2px 0}
  .log{max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .t{border-left:3px solid var(--acc);padding:8px 12px;background:#181d24;border-radius:0 8px 8px 0}
  .t.flag{border-color:var(--bad);background:#241618}
  .t .who{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .t .said{margin:3px 0} .t .rel{font-size:13px;color:#9fb4cc;font-style:italic}
  .banner{grid-column:1/-1;padding:12px 16px;border-radius:10px;font-weight:600;display:none}
  .banner.stop{display:block;background:#2a1414;border:1px solid var(--bad);color:#ffb4b4}
  .banner.ok{display:block;background:#0e2a22;border:1px solid var(--ok);color:#8ff0d5}
  .status{grid-column:1/-1;color:var(--dim);font-size:13px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NyayBandhan</h1>
    <span class="tag">Two languages. No common tongue. One term sheet that refuses to lie.</span>
  </header>

  <div class="mics">
    <button class="mic" id="m-vatsa"><b>Vatsa &mdash; Gujarati</b><span>hold to speak</span></button>
    <button class="mic" id="m-sreedev"><b>Sreedev &mdash; Malayalam</b><span>hold to speak</span></button>
    <button class="ghost" id="packet">Lawyer packet &rarr;</button>
    <button class="ghost" id="reset">Reset</button>
  </div>

  <div class="banner" id="banner"></div>
  <div class="status" id="status">Hold a mic button and speak. Release to send.</div>

  <div class="card"><h2>Term sheet</h2><div id="terms"></div></div>
  <div class="card"><h2>Call log</h2><div class="log" id="log"></div></div>
</div>

<audio id="player"></audio>
<script>
const $ = s => document.querySelector(s);
let rec = null, chunks = [], busy = false;

async function startCapture(onChunk){
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true}
  });
  const ctx = new AudioContext();
  await ctx.audioWorklet.addModule('/pcm-worklet.js');
  const src = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, 'pcm-worklet');
  node.port.onmessage = e => onChunk(e.data);
  src.connect(node);
  return {stop(){
    node.port.onmessage = null;
    node.disconnect(); src.disconnect();
    stream.getTracks().forEach(t => t.stop());
    ctx.close();
  }};
}

async function micFor(party, btn){
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  const mr = new MediaRecorder(stream, {mimeType: pickMime()});
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  mr.onstop = async () => {
    const blob = new Blob(chunks, {type: mr.mimeType}); chunks = [];
    btn.classList.remove('rec');
    if (blob.size < 1200) { setStatus('Too short &mdash; hold longer.'); return; }
    await send(party, blob);
  };
  return mr;
}

function pickMime(){
  for (const m of ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'])
    if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}

function setStatus(h){ $('#status').innerHTML = h; }

async function send(party, blob){
  busy = true; setStatus('Transcribing &amp; reading the term sheet&hellip;');
  const fd = new FormData();
  fd.append('audio', blob, 'turn.webm');
  fd.append('party', party);
  try{
    const r = await fetch('/turn', {method:'POST', body:fd});
    const d = await r.json();
    if (!r.ok){ setStatus('Error: ' + (d.error || r.status)); busy = false; return; }
    render(d);
    if (d.audio_b64){
      $('#player').src = 'data:audio/wav;base64,' + d.audio_b64;
      $('#player').play().catch(()=>{});
    }
    setStatus(d.flagged.length
      ? `<b style="color:var(--bad)">Interjected on: ${d.flagged.join(', ')}</b> &mdash; not recorded as agreed.`
      : `Relayed to ${d.relay_to}.`);
  }catch(e){ setStatus('Network error: ' + e.message); }
  busy = false;
}

function render(d){
  const t = document.createElement('div');
  t.className = 't' + (d.flagged.length ? ' flag' : '');
  t.innerHTML = `<div class="who">${d.speaker} &middot; turn ${d.turn}</div>
    <div class="said">${esc(d.transcript)}</div>
    <div class="rel">&rarr; ${esc(d.relay_text)}</div>`;
  $('#log').prepend(t);
  paint(d.sheet);
}

function paint(sheet){
  $('#terms').innerHTML = sheet.terms.map(t => {
    const quotes = t.proposals.length ? `<div class="quotes">${t.proposals.map(p =>
      `<div>&ldquo;${esc(p.verbatim)}&rdquo; &rarr; <b>${esc(p.value)}</b> <i>[${p.stance}]</i></div>`
    ).join('')}</div>` : '';
    const note = t.divergence_note ? `<div class="note">${esc(t.divergence_note)}</div>` : '';
    return `<div class="term">
      <div><div class="k">${t.key}</div><div class="v">${t.agreed_value || t.description}</div></div>
      <div class="st ${t.state}">${t.state}</div>${note}${quotes}</div>`;
  }).join('');

  const b = $('#banner');
  if (sheet.blocked.length){
    b.className = 'banner stop';
    b.innerHTML = `Cannot draft: ${sheet.blocked.join(', ')} &mdash; both sides said yes to different things, or hedged.`;
  } else if (sheet.terms.some(t => t.state === 'AGREED')){
    b.className = 'banner ok';
    b.textContent = 'All discussed terms agreed. Safe to send to the lawyer.';
  } else { b.className = 'banner'; }
}

const esc = s => (s ?? '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

for (const party of ['vatsa','sreedev']){
  const btn = $('#m-' + party);
  const start = async ev => {
    ev.preventDefault();
    if (busy || rec) return;
    rec = await micFor(party, btn);
    chunks = []; rec.start(); btn.classList.add('rec');
    setStatus('Listening&hellip; release to send.');
  };
  const stop = ev => {
    ev.preventDefault();
    if (!rec) return;
    rec.stop(); rec.stream?.getTracks().forEach(t => t.stop()); rec = null;
  };
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', start, {passive:false});
  addEventListener('mouseup', stop);
  btn.addEventListener('touchend', stop);
}

$('#packet').onclick = () => window.open('/packet', '_blank');
$('#reset').onclick = async () => {
  if (!confirm('Clear the whole negotiation?')) return;
  await fetch('/reset', {method:'POST'});
  $('#log').innerHTML = ''; location.reload();
};

fetch('/state').then(r => r.json()).then(paint);
</script>
</body>
</html>
